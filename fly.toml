# Dev dashboard on Fly.io, deployed by .github/workflows/fly-dev.yml on every push
# to `dev`. Read-only: the web bin never places orders.
app = "designtheclutch-trading-dev"
primary_region = "sjc"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # One machine stays up so the background morning refresh keeps running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
