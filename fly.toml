# Dev dashboard on Fly.io, deployed by .github/workflows/fly-dev.yml on every push
# to `dev`. Read-only: the web bin never places orders.
app = "designtheclutch-trading-dev"
primary_region = "sjc"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # One machine, always up: it owns the data volume and runs the daily refresh.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# Bars, reports and backtest runs survive deploys, so a deploy only backfills the
# bars that are new since the last run. A volume belongs to one machine, hence one.
[mounts]
  source = "data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
