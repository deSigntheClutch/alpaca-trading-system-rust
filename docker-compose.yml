# Local dev databases. Start only what you need:
#   docker compose up -d scylla        # event WAL;  docker exec -i alpaca-scylla cqlsh < db/schema.cql
#   docker compose up -d clickhouse    # research store;  CH_PASSWORD=dev ./scripts/ch-load-bars.sh
# ClickHouse Play UI: http://localhost:8123/play  (user alpaca / dev)
services:
  scylla:
    image: scylladb/scylla:5.4
    container_name: alpaca-scylla
    # Dev flags: keep it small and forgiving on a laptop.
    command: --smp 1 --memory 1G --overprovisioned 1 --developer-mode 1
    ports:
      - "9042:9042"
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:lts
    container_name: alpaca-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: alpaca
      CLICKHOUSE_USER: alpaca
      CLICKHOUSE_PASSWORD: dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  scylla-data:
  clickhouse-data:
