# Leptos CSR (client-side) app, built by trunk to wasm. Runs entirely in the
# browser; for a daily report the data is precomputed, so no server is needed.
[package]
name = "alpaca-web"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
console_error_panic_hook = "0.1" # readable panics in the browser console
alpaca-core = { path = "../core" } # shared pure domain types (Sector/Timeframe/pct_change)

# Own workspace on purpose: wasm-only crate, kept out of the root workspace so
# `cargo build` at the root (native) never tries to compile this. trunk builds it.
[workspace]
