# Multi-agent AI trading system on Alpaca. Native binary (no wasm now).
#   core   - pure deterministic indicators/signals, used as agent "tools"
#   agents - Alpaca client, Claude LLM client, the agents + orchestrator, audit log
#   app    - CLI entrypoint that runs the pipeline over a watchlist
[workspace]
resolver = "2"
members = ["crates/core", "crates/agents", "crates/app"]

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
alpaca-core = { path = "crates/core" }
alpaca-agents = { path = "crates/agents" }
