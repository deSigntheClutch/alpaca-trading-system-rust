[package]
name = "alpaca-trading-system"
version = "0.1.0"
edition = "2021"

# One package: `src/lib.rs` (modules, layered) + `src/main.rs` (the binary).
[[bin]]
name = "crypto-agent"
path = "src/main.rs"

[dependencies]
# runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
futures = "0.3"
async-trait = "0.1"
# http / serde
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# money / errors / obs
rust_decimal = { version = "1", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
scylla = "1.8.0"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots", "connect"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[dev-dependencies]
rust_decimal_macros = "1.40.0"
